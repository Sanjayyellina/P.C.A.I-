[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pcai"
version = "0.1.0"
description = "P.C.A.I. counting-first pharmaceutical tablet observation and verification platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "P.C.A.I. Engineering" }
]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.8,<3",
  "structlog>=24.2,<26",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pcai"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["pcai"]

[[tool.mypy.overrides]]
module = ["cv2.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["pcai"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
